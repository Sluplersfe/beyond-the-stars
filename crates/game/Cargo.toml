[package]
name = "game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true }
sim = { path = "../sim" }
serde = { workspace = true }
serde_json = "1"
wry = { version = "0.57", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
default = ["html-menu"]
# Embed the HTML main-menu background in a native webview (WebKitGTK on Linux, X11 only).
html-menu = ["dep:wry", "dep:gtk"]
