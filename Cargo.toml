[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "UNLICENSED"

[workspace.dependencies]
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"

# Fast iteration: optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
